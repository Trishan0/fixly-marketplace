name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fixly
          POSTGRES_PASSWORD: fixly_test_password
          POSTGRES_DB: fixly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixly -d fixly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://fixly:fixly_test_password@127.0.0.1:5432/fixly_test
      JWT_SECRET: ci-only-fixly-secret
      CLIENT_URL: http://localhost.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm run typecheck:persistence
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run db:migrate -- --env TEST_DATABASE_URL
        working-directory: backend
      - run: npm run db:schema:verify
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
