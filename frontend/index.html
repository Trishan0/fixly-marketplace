<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixly - Find trusted local workers in Sri Lanka</title>
    <meta name="description" content="Post a job, compare quotes from ID-checked local plumbers, electricians, carpenters and cleaners, and hire with confidence. Fixly is Sri Lanka’s local services marketplace." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" type="image/png" sizes="32x32" href="/fixly-favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/fixly-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn, Slack, X). These bots do not run JavaScript. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fixly" />
    <meta property="og:locale" content="en_LK" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Fixly - Find trusted local workers in Sri Lanka" />
    <meta property="og:description" content="Post a job, compare quotes from ID-checked local workers, and hire with confidence." />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fixly: find trusted local workers in Sri Lanka" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fixly - Find trusted local workers in Sri Lanka" />
    <meta name="twitter:description" content="Post a job, compare quotes from ID-checked local workers, and hire with confidence." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%SITE_URL%/#organization",
            "name": "Fixly",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/fixly-icon-512.png",
            "areaServed": { "@type": "Country", "name": "Sri Lanka" }
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "name": "Fixly",
            "url": "%SITE_URL%/",
            "inLanguage": "en-LK",
            "publisher": { "@id": "%SITE_URL%/#organization" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
